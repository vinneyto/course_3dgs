name: Apply rectangular Gaussian AABB optimization

on:
  push:
    branches:
      - optimize-rectangular-gaussian-aabb

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-rectangular-gaussian-aabb
          fetch-depth: 0

      - name: Update notebook AABBs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("3dgs_metal.ipynb")
          notebook = json.loads(path.read_text())

          old = [
              "    major_variance = evals[:, 1].clamp_min(1e-12).clamp_max(1e4) # [Nk]\n",
              "    radius = torch.ceil(3.0 * torch.sqrt(major_variance)).to(torch.int64) # [Nk]\n",
              "    \n",
              "    umin = torch.floor(u - radius).to(torch.int64)\n",
              "    umax = torch.floor(u + radius).to(torch.int64)\n",
              "    vmin = torch.floor(v - radius).to(torch.int64)\n",
              "    vmax = torch.floor(v + radius).to(torch.int64)\n",
          ]
          new = [
              "    # Axis-aligned 3-sigma bounds of the projected ellipse.\n",
              "    # Separate u/v extents avoid the old square AABB based on the major axis.\n",
              "    variance_u = sigma_uv[:, 0, 0].clamp_min(1e-12).clamp_max(1e4) # [Nk]\n",
              "    variance_v = sigma_uv[:, 1, 1].clamp_min(1e-12).clamp_max(1e4) # [Nk]\n",
              "    radius_u = torch.ceil(3.0 * torch.sqrt(variance_u)).to(torch.int64) # [Nk]\n",
              "    radius_v = torch.ceil(3.0 * torch.sqrt(variance_v)).to(torch.int64) # [Nk]\n",
              "    \n",
              "    umin = torch.floor(u - radius_u).to(torch.int64)\n",
              "    umax = torch.floor(u + radius_u).to(torch.int64)\n",
              "    vmin = torch.floor(v - radius_v).to(torch.int64)\n",
              "    vmax = torch.floor(v + radius_v).to(torch.int64)\n",
          ]

          replacements = 0
          for cell in notebook["cells"]:
              source = cell.get("source")
              if not isinstance(source, list):
                  continue
              for i in range(len(source) - len(old) + 1):
                  if source[i:i + len(old)] == old:
                      source[i:i + len(old)] = new
                      replacements += 1
                      break

          if replacements != 2:
              raise RuntimeError(f"Expected 2 AABB replacements, got {replacements}")

          path.write_text(json.dumps(notebook, indent=1, ensure_ascii=False) + "\n")
          json.loads(path.read_text())
          PY

      - name: Verify rectangular AABBs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook = json.loads(Path("3dgs_metal.ipynb").read_text())
          source = "\n".join(
              "".join(cell.get("source", []))
              for cell in notebook["cells"]
              if cell.get("cell_type") == "code"
          )
          assert source.count("radius_u = torch.ceil(3.0 * torch.sqrt(variance_u))") == 2
          assert source.count("radius_v = torch.ceil(3.0 * torch.sqrt(variance_v))") == 2
          assert "major_variance = evals[:, 1]" not in source
          assert "u - radius)" not in source
          assert "v - radius)" not in source
          PY

      - name: Commit notebook change and remove helper workflow
        run: |
          rm .github/workflows/apply-rectangular-aabb.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 3dgs_metal.ipynb .github/workflows/apply-rectangular-aabb.yml
          git commit -m "Optimize projected Gaussian AABBs"
          git push origin HEAD:optimize-rectangular-gaussian-aabb
